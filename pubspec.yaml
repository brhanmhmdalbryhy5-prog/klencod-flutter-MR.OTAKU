name: mr_otaku
description: تطبيق مستر أوتاكو - مجتمع ومسابقات الأنمي
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # Local storage
  shared_preferences: ^2.2.3
  sqflite: ^2.4.2
  path: ^1.9.1

  # Network connectivity
  connectivity_plus: ^6.1.4
  http: ^1.2.1

  # Media
  image_picker: ^1.0.0
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  gal: 2.3.0

  # Notifications and background tasks
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.5.2
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dependency_overrides:
  app_links: 6.3.0
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true