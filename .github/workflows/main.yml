
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Gal Android Build
        run: |
          GAL_GRADLE=$(find "$HOME/.pub-cache/hosted/pub.dev" -path "*/gal-*/android/build.gradle" -print -quit)

          if [ -z "$GAL_GRADLE" ]; then
            echo "ERROR: Gal build.gradle not found"
            exit 1
          fi

          echo "Fixing: $GAL_GRADLE"

          sed -i 's/flutter\.compileSdkVersion/34/g' "$GAL_GRADLE"

          echo "Updated Gal compileSdk:"
          grep -n "compileSdk" "$GAL_GRADLE"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
